<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1390" viewBox="0 0 1800 1390"><rect width="1800" height="1390" fill="white"/>
<text x="70" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Proposed flash-sale system architecture</text>
<text x="70" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#334155">Component tree • 500 phones • One unit per checkout • Payment processing outside scope</text>
<path d="M 900 235 V 280 H 325 V 325 M 900 280 V 325 M 900 280 H 1475 V 325" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="600" y="155" width="600" height="80" rx="12" fill="#164e63" stroke="#164e63" stroke-width="2"/>
<text x="622" y="192" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">FLASH-SALE CHECKOUT SYSTEM</text>
<rect x="70" y="325" width="510" height="70" rx="12" fill="#164e63" stroke="#164e63" stroke-width="2"/>
<text x="92" y="362" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">FRONTEND / CLIENT</text>
<rect x="645" y="325" width="510" height="70" rx="12" fill="#164e63" stroke="#164e63" stroke-width="2"/>
<text x="667" y="362" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">BACKEND / PROCESSING</text>
<rect x="1220" y="325" width="510" height="70" rx="12" fill="#164e63" stroke="#164e63" stroke-width="2"/>
<text x="1242" y="362" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">DATABASE / STORAGE</text>
<path d="M 105 395 V 1032" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 105 507 H 135" fill="none" stroke="#64748b" stroke-width="3"/>
