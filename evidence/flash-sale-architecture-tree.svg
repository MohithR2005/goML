<path d="M 680 395 V 1032" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 680 507 H 710" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 680 682 H 710" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 680 857 H 710" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 680 1032 H 710" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 1255 395 V 1032" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 1255 507 H 1285" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 1255 682 H 1285" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 1255 857 H 1285" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M 1255 1032 H 1285" fill="none" stroke="#64748b" stroke-width="3"/>
<rect x="135" y="445" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="157" y="482" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">CDN + static assets</text>
<text x="157" y="518" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Serve HTML, CSS, JS and images.</text>
<text x="157" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Keep the initial bundle small.</text>
<rect x="135" y="620" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="157" y="657" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Purchase interaction</text>
<text x="157" y="693" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Disable repeated Buy clicks.</text>
<text x="157" y="722" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Reuse attempt ID for retries.</text>
<rect x="135" y="795" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="157" y="832" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Status and feedback</text>
<text x="157" y="868" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Poll status at bounded intervals.</text>
<text x="157" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Pending / confirmed / unavailable.</text>
<rect x="135" y="970" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="157" y="1007" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Responsive user interface</text>
<text x="157" y="1043" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Keep the page usable while waiting.</text>
<text x="157" y="1072" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Confirm only after database commit.</text>
<rect x="710" y="445" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="482" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Gateway + load balancer</text>
<text x="732" y="518" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Rate-limit abusive traffic.</text>
<text x="732" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Route requests across API instances.</text>
<rect x="710" y="620" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="657" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Stateless checkout API</text>
<text x="732" y="693" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Validate and deduplicate attempts.</text>
<text x="732" y="722" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Return 202 after durable acceptance.</text>
<rect x="710" y="795" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="832" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Durable message queue</text>
<text x="732" y="868" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Buffer accepted checkout work.</text>
<text x="732" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Recover interrupted publication.</text>
<rect x="710" y="970" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="732" y="1007" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Workers + recovery</text>
<text x="732" y="1043" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Bound concurrent database writes.</text>
<text x="732" y="1072" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Retry safely; acknowledge on commit.</text>
<rect x="1285" y="445" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1307" y="482" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Redis reservations</text>
<text x="1307" y="518" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Atomic check + decrement + record.</text>
<text x="1307" y="547" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Admit attempts only if tokens remain.</text>
<rect x="1285" y="620" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1307" y="657" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Relational database</text>
<text x="1307" y="693" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Final authority for orders and stock.</text>
<text x="1307" y="722" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Store persistent request outcomes.</text>
<rect x="1285" y="795" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1307" y="832" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Consistency safeguards</text>
<text x="1307" y="868" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Conditional stock update + transaction.</text>
<text x="1307" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Unique attempt ID prevents duplicates.</text>
<rect x="1285" y="970" width="445" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1307" y="1007" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Reconciliation</text>
<text x="1307" y="1043" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Recover unresolved reservations.</text>
<text x="1307" y="1072" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#475569">Check outcomes before releasing stock.</text>
<text x="70" y="1170" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63">CHECKOUT FLOW</text>
<text x="70" y="1210" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#334155">Browser → gateway → checkout API → Redis reservation → recoverable queue handoff → worker → database</text>
<text x="70" y="1265" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155">Tree branches show responsibilities, not request order. The checkout flow above shows the processing sequence.</text>
<text x="70" y="1305" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155">Redis reservation and queue publication are separate writes; the handoff needs durable tracking and recovery.</text>
<text x="70" y="1345" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#334155">N+1 requires joins or batch reads. Queuing controls load; it does not eliminate inefficient queries or database locks.</text>
</svg>